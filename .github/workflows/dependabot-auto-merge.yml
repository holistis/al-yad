name: Dependabot auto-merge

# The grouped minor-and-patch pull request of Dependabot turns on auto-merge. GitHub then merges it only after
# the required checks of the default branch are green (see its branch protection). Major updates are not in that
# group, so they stay open until a person has read them. No third-party action is used on purpose: this job has
# write access and the only thing it runs is the GitHub CLI.
on:
  pull_request:

permissions: {}

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && contains(github.event.pull_request.head.ref, '/minor-and-patch-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Turn on auto-merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
