name: Publish yadagent

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm publishing the current version in packages/companion/npm-package/package.json to npm'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'publish'
    # ubuntu-latest, not ci.yml's windows-latest: the two failed publish
    # attempts on windows-latest both got a 404 on the actual `npm publish`
    # PUT after the provenance statement signed successfully, which smells
    # like an OIDC/trusted-publishing quirk specific to that runner OS. None
    # of the steps below (esbuild bundling, file-existence checks in
    # verify.mjs) need Windows — only the rest of ci.yml's suite does, for
    # native-messaging-specific tests unrelated to building this package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # 22: the latest npm (needed for trusted publishing/provenance)
          # requires Node >=22.22.2 and refuses to install itself on Node 20
          # (EBADENGINE). This is also the Node major ci.yml builds and tests
          # on, since vitest 5, wxt 0.21 and jsdom 30 all need Node 22.
          node-version: 22
          cache: "pnpm"
          registry-url: https://registry.npmjs.org

      - name: Update npm (trusted publishing + provenance need npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace (produces packages/shared/dist and packages/companion/dist)
        run: pnpm build

      - name: Build + verify yadagent npm package
        working-directory: packages/companion/npm-package
        run: |
          npm ci
          node scripts/build.mjs
          node scripts/verify.mjs

      - name: Publish to npm with provenance
        working-directory: packages/companion/npm-package
        run: npm publish --provenance --access public
