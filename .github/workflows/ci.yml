name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20.12"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: License check
        run: pnpm check-licenses

      - name: Build + verify yadagent npm package
        # A separate, isolated build (its own package.json, its own esbuild
        # dependency, not a pnpm workspace member) that bundles the companion
        # for standalone npm distribution. Needs pnpm build above to have
        # already produced packages/shared/dist and packages/companion/dist,
        # since esbuild resolves @yad/shared through the pnpm symlink into
        # that built output. Run in CI so a change to the companion's source
        # cannot silently break the published package without anyone noticing,
        # which is the exact failure mode this whole project exists to catch
        # elsewhere.
        working-directory: packages/companion/npm-package
        run: |
          npm install
          node scripts/build.mjs
          node scripts/verify.mjs
