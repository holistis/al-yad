name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # vitest 5, wxt 0.21 and jsdom 30 need Node 22 or newer. The yadagent
          # npm package still declares node >=20, see the Node 20 step below.
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Playwright zelf (het npm-pakket) staat al via pnpm install hierboven, maar de
      # BROWSER-BINARY (chrome-headless-shell) is een apart, los gedownload bestand dat
      # geen enkele bestaande stap ooit installeerde — tot nu toe testte niets in deze
      # workflow een echte browser-launch. De nieuwe live/integratietests
      # (playwright-hand.crossFrame.test.ts, playwright-hand.cdpLifecycle.test.ts,
      # scope-guard.crossOriginHijack.integration.test.ts) starten wel een ECHTE
      # Chromium, en faalden hierdoor stil op CI met "Executable doesn't exist"
      # (2026-09-16, ontdekt bij het openen van deze PR). Alleen chromium nodig, geen
      # firefox/webkit — dat is het enige dat de companion-code aanroept.
      - name: Install Playwright browser (chromium)
        working-directory: packages/companion
        run: pnpm exec playwright install chromium

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: License check
        run: pnpm check-licenses

      # Loads the built store variant of the extension into the Chromium installed above and
      # checks the manifest, the service worker, the side panel, the legal pages and the content
      # script. The selftest then plants faults in a copy of the build and requires the smoke
      # test to fail on each of them, which proves the smoke test is not blind. It runs the
      # smoke test on the untouched build first, so it covers that case too.
      - name: Extension smoke test and selftest
        run: pnpm extension-smoke:selftest

      # The store upload script reads the manifest out of the exact zip it is about to send and
      # refuses anything that is not the store variant (debugger, cookies, any permission not on
      # the fixed list, the full variant's name, a development key, a doubled manifest.json). The
      # selftest plants each of those faults and requires a refusal, including from the upload
      # script itself before it touches the network.
      - name: Store zip gate selftest
        run: pnpm winkelzip-poort:selftest

      # This repo is public, so nothing personal may be committed to it. The gate works from an
      # allowlist: any e-mail address, public IPv4 address or full wallet address that is not on
      # the list, and any file where a user keeps their own data (memory files, keys, sessions,
      # backups), fails the build. The selftest plants each of those and requires a failure.
      - name: Public repo gate and selftest
        run: pnpm openbaar-schoon-poort:selftest

      - name: Build + verify yadagent npm package
        # A separate, isolated build (its own package.json, its own esbuild
        # dependency, not a pnpm workspace member) that bundles the companion
        # for standalone npm distribution. Needs pnpm build above to have
        # already produced packages/shared/dist and packages/companion/dist,
        # since esbuild resolves @yad/shared through the pnpm symlink into
        # that built output. Run in CI so a change to the companion's source
        # cannot silently break the published package without anyone noticing,
        # which is the exact failure mode this whole project exists to catch
        # elsewhere.
        working-directory: packages/companion/npm-package
        run: |
          npm ci
          node scripts/build.mjs
          node scripts/verify.mjs

      # The tests above run on Node 22, but yadagent still declares node >=20. The selftest
      # shows the handshake check can fail, then the freshly built bundle has to start and
      # answer the native messaging handshake under Node 20 as well.
      - name: Handshake selftest (planted faults must fail the check)
        working-directory: packages/companion/npm-package
        run: node scripts/handshake.selftest.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Start the yadagent bundle on Node 20
        working-directory: packages/companion/npm-package
        run: node scripts/handshake.mjs
