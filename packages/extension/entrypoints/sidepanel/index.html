<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yad</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
      }
      body {
        margin: 0;
        padding: 14px;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 10px;
      }
      .hidden {
        display: none;
      }
      .dot {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 8px;
        background: #9ca3af;
        vertical-align: middle;
      }
      .verbonden { background: #16a34a; }
      .verbinden { background: #d97706; }
      .verbroken { background: #dc2626; }
      #status { margin-bottom: 12px; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 64px;
        font: inherit;
        padding: 8px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        resize: vertical;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border: none;
        border-radius: 6px;
        background: #111827;
        color: #fff;
        cursor: pointer;
      }
      button:disabled { background: #9ca3af; cursor: not-allowed; }
      button.secondary { background: #e5e7eb; color: #111827; }
      .row { display: flex; gap: 8px; margin-top: 8px; }
      .gate-item { display: flex; gap: 8px; margin: 10px 0; align-items: flex-start; }
      .gate-item input { margin-top: 3px; }
      .docs a { display: block; margin: 4px 0; color: #2563eb; }
      .summary { background: #f3f4f6; padding: 10px; border-radius: 6px; line-height: 1.4; }
      #log {
        margin-top: 12px;
        max-height: 320px;
        overflow-y: auto;
        border-top: 1px solid #e5e7eb;
        padding-top: 8px;
      }
      .logline { padding: 4px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
      .logline .tag { font-weight: 600; margin-right: 6px; }
      .tag.klaar { color: #16a34a; }
      .tag.fout, .tag.geweigerd, .tag.gestopt { color: #dc2626; }
      .tag.bezig, .tag.plannen { color: #d97706; }
      #confirm {
        margin-top: 12px;
        border: 1px solid #d97706;
        background: #fffbeb;
        border-radius: 6px;
        padding: 10px;
      }
      .note { color: #6b7280; font-size: 12px; margin-top: 10px; }
      pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; }
    </style>
  </head>
  <body>
    <!-- Akkoord-poort -->
    <section id="gate" class="hidden">
      <h1>Voor je begint</h1>
      <div class="summary" id="gate-summary"></div>
      <div class="docs">
        <a href="#" data-doc="algemene-voorwaarden">Algemene Voorwaarden</a>
        <a href="#" data-doc="privacyverklaring">Privacyverklaring</a>
        <a href="#" data-doc="gebruiksbeleid">Gebruiksbeleid</a>
      </div>
      <div id="gate-items"></div>
      <button id="accept" disabled>Akkoord en starten</button>
      <p class="note">Dit is een concept. Laat het bij twijfel door een jurist bekijken.</p>
    </section>

    <!-- Werk-UI -->
    <section id="app" class="hidden">
      <h1>Yad — de hand</h1>
      <div id="status"><span class="dot"></span><span id="label">…</span></div>

      <textarea id="goal" placeholder="Wat moet ik doen op deze pagina?"></textarea>
      <div class="row">
        <button id="start" disabled>Start taak</button>
        <button id="clear" class="secondary">Wis log</button>
      </div>

      <div id="confirm" class="hidden"></div>
      <div id="log"></div>
      <p class="note">Yad werkt op de tab die actief is wanneer je op Start klikt. Herlaad die pagina één keer na het installeren.</p>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
